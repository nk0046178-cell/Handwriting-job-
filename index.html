<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Handwriting Work - New Joining</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 35px 25px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 30px;
      color: #172b4d;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #666;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .job-box {
      background: #f4f7ff;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .job-box h2 {
      color: #1e5eff;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .job-box p {
      color: #555;
      line-height: 1.6;
    }

    .telegram-btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      background: #229ED9;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
      transition: 0.2s;
    }

    .telegram-btn:hover {
      background: #168dcc;
      transform: translateY(-2px);
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Apna logo lagane ke liye logo.jpg naam ki file upload karein -->
    <img src="logo.jpg" alt="Vishv Book Publication" class="logo">

    <h1>Handwriting Work</h1>

    <p class="subtitle">
      📝 New Handwriting Work Joining<br>
      Get complete work details and joining information.
    </p>

    <div class="job-box">
      <h2>📚 New Joining</h2>
      <p>
        Handwriting work ke details aur joining process ke liye
        Telegram par contact karein.
      </p>
    </div>

    <!-- TELEGRAM BUTTON -->
    <a
      href="https://t.me/Nitin_Kumar_Singh_018?text=New%20Joining%20%F0%9F%93%9D"
      class="telegram-btn"
      target="_blank"
      rel="noopener noreferrer">
      ✈️ Join on Telegram
    </a>

    <p class="note">
      Telegram button par click karke joining details ke liye message bhejein.
    </p>

  </div>

</body>
  </html>
